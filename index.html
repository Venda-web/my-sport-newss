<!DOCTYPE html>
<html>
<head>
    <title>СпортНовости (Админка)</title>
    <meta charset="utf-8">
    <style>
        body { margin: 0; font-family: Arial; background: #f0f0f0; }
        .header { background: #1a2a3a; color: white; font-size: 24px; padding: 15px; text-align: center; }
        .container { max-width: 900px; margin: 10px auto; padding: 10px; }
        .column { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; }
        h2 { margin: 0 0 10px 0; }
        .news { border-bottom: 1px solid #ddd; padding: 8px 0; }
        .news:last-child { border: 0; }
        .date { color: gray; font-size: 12px; }
        .admin-panel { background: #ffe4e1; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        input, textarea { width: 100%; margin: 5px 0; padding: 5px; border: 1px solid #ccc; }
        button { background: #1a2a3a; color: white; border: 0; padding: 8px; margin: 2px; cursor: pointer; }
        .login-box { background: #fff3cd; padding: 20px; border-radius: 10px; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="header">⚽ СПОРТНОВОСТИ 🏒</div>

<div class="container" id="app">
    <!-- Блок входа (виден всем, кто не залогинился) -->
    <div id="loginBlock" class="login-box">
        <h3>🔐 Вход для администратора</h3>
        <input type="password" id="passwordInput" placeholder="Введи пароль">
        <button onclick="checkPassword()">Войти</button>
        <div id="loginError" style="color:red; margin-top:10px;"></div>
    </div>

    <!-- Блок редактирования (виден только после входа) -->
    <div id="adminBlock" class="hidden">
        <div class="admin-panel">
            <h3>⚙️ Панель управления</h3>
            <button onclick="logout()" style="background: #dc3545;">Выйти</button>
        </div>

        <!-- Футбол -->
        <div class="column">
            <h2 style="color:green;">⚽ ФУТБОЛ</h2>
            <div id="footballNews"></div>
            <div id="footballForm">
                <input id="fDate" placeholder="Дата" value="18.02.2026">
                <input id="fTitle" placeholder="Заголовок" value="Роналду забил гол">
                <textarea id="fText" placeholder="Текст">Португалец открыл счет</textarea>
                <button onclick="addFootball()">➕ Добавить</button>
            </div>
        </div>
        
        <!-- Хоккей -->
        <div class="column">
            <h2 style="color:blue;">🏒 ХОККЕЙ</h2>
            <div id="hockeyNews"></div>
            <div id="hockeyForm">
                <input id="hDate" placeholder="Дата" value="18.02.2026">
                <input id="hTitle" placeholder="Заголовок" value="Овечкин забросил">
                <textarea id="hText" placeholder="Текст">37-я шайба в сезоне</textarea>
                <button onclick="addHockey()">➕ Добавить</button>
            </div>
        </div>
    </div>

    <!-- Сообщение для обычных посетителей -->
    <div style="text-align:center; color:gray; padding:10px;">
        Новости обновляются администратором
    </div>
</div>

<script>
// ======== ТВОЙ ПАРОЛЬ (поменяй на свой) ========
const SECRET_PASSWORD = "sport123";

// ======== Данные (хранятся в браузере) ========
let football = JSON.parse(localStorage.getItem('football') || '[]');
let hockey = JSON.parse(localStorage.getItem('hockey') || '[]');
let isAdmin = false;

// Проверка пароля
function checkPassword() {
    const pwd = document.getElementById('passwordInput').value;
    if(pwd === SECRET_PASSWORD) {
        isAdmin = true;
        document.getElementById('loginBlock').classList.add('hidden');
        document.getElementById('adminBlock').classList.remove('hidden');
        document.getElementById('loginError').innerHTML = '';
        showNews();
    } else {
        document.getElementById('loginError').innerHTML = 'Неверный пароль!';
    }
}

// Выход
function logout() {
    isAdmin = false;
    document.getElementById('loginBlock').classList.remove('hidden');
    document.getElementById('adminBlock').classList.add('hidden');
    showNews();
}

// Добавить футбол (только для админа)
function addFootball() {
    if(!isAdmin) return;
    football.push({
        date: document.getElementById('fDate').value,
        title: document.getElementById('fTitle').value,
        text: document.getElementById('fText').value
    });
    saveAll();
}

// Добавить хоккей (только для админа)
function addHockey() {
    if(!isAdmin) return;
    hockey.push({
        date: document.getElementById('hDate').value,
        title: document.getElementById('hTitle').value,
        text: document.getElementById('hText').value
    });
    saveAll();
}

// Удалить новость (только для админа)
function deleteNews(sport, index) {
    if(!isAdmin) return;
    if(sport == 'f') football.splice(index, 1);
    else hockey.splice(index, 1);
    saveAll();
}

// Сохранить и показать
function saveAll() {
    localStorage.setItem('football', JSON.stringify(football));
    localStorage.setItem('hockey', JSON.stringify(hockey));
    showNews();
}

// Показать новости (для всех)
function showNews() {
    let fHtml = '', hHtml = '';
    
    football.forEach((item, i) => {
        fHtml += `<div class="news">
            <span class="date">${item.date}</span>
            <b>${item.title}</b><br>${item.text}`;
        
        // Если админ - показываем кнопку удаления
        if(isAdmin) {
            fHtml += `<button onclick="deleteNews('f', ${i})" style="float:right;">✖</button>`;
        }
        
        fHtml += `</div>`;
    });
    
    hockey.forEach((item, i) => {
        hHtml += `<div class="news">
            <span class="date">${item.date}</span>
            <b>${item.title}</b><br>${item.text}`;
        
        if(isAdmin) {
            hHtml += `<button onclick="deleteNews('h', ${i})" style="float:right;">✖</button>`;
        }
        
        hHtml += `</div>`;
    });
    
    document.getElementById('footballNews').innerHTML = fHtml || '<p>Нет новостей</p>';
    document.getElementById('hockeyNews').innerHTML = hHtml || '<p>Нет новостей</p>';
}

// Показать при загрузке
showNews();
</script>

</body>
</html>
